<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVerse Premium</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background-color: #0b0b0b; color: #ffffff; font-family: sans-serif; margin:0; padding:0; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 4%; background: #000; position: sticky; top:0; z-index:1000; }
        .logo span { color: #e50914; }
        .nav-links a { color: #e5e5e5; margin-right: 20px; text-decoration: none; font-weight: bold; }
        .nav-links a:hover, .nav-links a.active { color: #e50914; }
        #search-bar { background: #111; border: 2px solid #333; color: white; padding: 8px 15px; border-radius: 20px; width: 250px; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
        .movie-card { background: #141414; border-radius: 8px; overflow: hidden; cursor: pointer; transition: 0.3s; }
        .movie-card:hover { transform: scale(1.05); }
        .player-page-container { display: none; padding: 40px 4%; }
        .video-box-wrapper iframe { width:100%; height:520px; border:none; }
        .mirror-btn { background:#e50914; color:white; border:none; padding:12px; border-radius:6px; cursor:pointer; width:100%; margin-top:10px; }
    </style>
</head>
<body>

<div id="main-website-view">
    <header class="navbar">
        <div class="logo">Stream<span>Verse</span></div>
        <nav class="nav-links">
            <a href="#" onclick="loadCategory('trending', event)" class="active">Trending</a>
            <a href="#" onclick="loadCategory('hollywood', event)">Hollywood</a>
            <a href="#" onclick="loadCategory('bollywood', event)">Bollywood</a>
            <a href="#" onclick="loadCategory('punjabi', event)">Punjabi</a>
            <a href="#" onclick="loadCategory('south', event)">South</a>
            <a href="#" onclick="loadCategory('series', event)">Series</a>
        </nav>
        <input type="text" id="search-bar" placeholder="Search..." onkeyup="searchHandler()">
    </header>

    <section class="hero-banner">
        <h1>StreamVerse Premium</h1>
    </section>

    <main class="main-content">
        <h2 id="current-category-title">Trending Content</h2>
        <div class="movie-grid" id="movie-grid-container"></div>
    </main>
</div>

<div id="player-page-view" class="player-page-container">
    <button onclick="exitPlayerPage()">← Back</button>
    <h1 id="player-media-title">Loading...</h1>
    <p id="player-media-meta"></p>
    <div class="player-main-grid">
        <div class="video-box-wrapper" id="video-frame-target"></div>
        <div class="series-control-panel">
            <h3>Controls</h3>
            <div id="episodes-dropdown-wrapper" style="display:none;">
                <select id="season-selector"></select>
                <select id="episode-selector"></select>
            </div>
            <button class="mirror-btn" onclick="tryAlternativeSource()">Alternative Mirror</button>
        </div>
    </div>
</div>

<script src="movie_data.js"></script>
<script src="hollywood_servers.js"></script>
<script src="bollywood_servers.js"></script>
<script src="player.js"></script>
<script src="series_fixer.js"></script>
<script src="booster.js"></script>
<script src="app.js"></script>

<script>
    const API_KEY = "82e880c89dbf119b940e034ed32a3498";

    async function loadCategory(cat, e) {
        if(e) e.preventDefault();
        document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
        if(e) e.target.classList.add('active');

        if(typeof exitPlayerPage === 'function') exitPlayerPage();

        const container = document.getElementById('movie-grid-container');
        container.innerHTML = "<div style='text-align:center;padding:40px;color:#aaa;'>Loading...</div>";

        let url = `https://api.themoviedb.org/3/trending/movie/day?api_key=${API_KEY}`;
        let title = "Trending Content";
        let typeP = "movie";

        if(cat === 'hollywood') url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_original_language=en&sort_by=popularity.desc`;
        else if(cat === 'bollywood') url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_original_language=hi&sort_by=popularity.desc`;
        else if(cat === 'series') {
            url = `https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&sort_by=popularity.desc`;
            title = "Web Series";
            typeP = "tv";
        }

        document.getElementById('current-category-title').innerText = title;

        try {
            let res = await fetch(url);
            let data = await res.json();
            displayGrid(data.results, typeP);
        } catch(err) {
            container.innerHTML = "<p style='color:red;text-align:center;'>Failed to load. Try again.</p>";
        }
    }

    function displayGrid(items, defaultType) {
        const container = document.getElementById('movie-grid-container');
        container.innerHTML = "";
        items.forEach(item => {
            let title = item.title || item.name;
            let year = (item.release_date || item.first_air_date || "N/A").split("-")[0];
            let type = item.media_type || defaultType;
            let poster = item.poster_path ? `https://image.tmdb.org/t/p/w400${item.poster_path}` : 'https://via.placeholder.com/300x450';

            const card = document.createElement('div');
            card.className = 'movie-card';
            card.innerHTML = `
                <img src="${poster}" style="width:100%;height:260px;object-fit:cover;">
                <div style="padding:10px;"><strong>${title}</strong><br><small>${year}</small></div>
            `;
            card.onclick = () => window.routeToDedicatedPlayer(item.id, title, type, year);
            container.appendChild(card);
        });
    }

    function searchHandler() {
        if(typeof searchMovies === 'function') searchMovies();
    }
</script>
</body>
</html>
