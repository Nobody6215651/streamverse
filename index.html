<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVerse Premium</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .section { padding: 20px 5%; }
        .section-title { font-size: 28px; margin: 30px 0 15px; padding-left: 15px; border-left: 5px solid #e50914; display: flex; align-items: center; gap: 10px; }
        .scroll-container { display: flex; overflow-x: auto; gap: 18px; padding: 10px 0; scrollbar-width: none; }
        .scroll-container::-webkit-scrollbar { display: none; }
        .movie-card { min-width: 170px; background: #141414; border-radius: 10px; overflow: hidden; cursor: pointer; transition: 0.3s; }
        .movie-card:hover { transform: scale(1.08); }
        .movie-poster { width:100%; height:250px; object-fit: cover; }
        .boost-panel { position: fixed; bottom: 100px; right: 30px; background: #1f1f1f; padding: 15px; border-radius: 12px; width: 220px; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 99999; }
    </style>
</head>
<body>

<div id="main-website-view">
    <header class="navbar"> ... (same navbar as before) </header>

    <!-- All Time GOAT - Top Section -->
    <div class="section">
        <h2 class="section-title">👑 All Time GOAT Movies</h2>
        <div class="scroll-container" id="goat-grid"></div>
    </div>

    <!-- Trending -->
    <div class="section">
        <h2 class="section-title">🔥 Trending Now</h2>
        <div class="scroll-container" id="trending-grid"></div>
    </div>

    <!-- Hollywood, Bollywood, etc. (same pattern) -->
    <div class="section">
        <h2 class="section-title">🎬 Hollywood Blockbusters</h2>
        <div class="scroll-container" id="hollywood-grid"></div>
    </div>

    <div class="section">
        <h2 class="section-title">🇮🇳 Bollywood Hits</h2>
        <div class="scroll-container" id="bollywood-grid"></div>
    </div>

    <div class="section">
        <h2 class="section-title">🌍 South & Punjabi</h2>
        <div class="scroll-container" id="regional-grid"></div>
    </div>
</div>

<!-- Player same as before -->

<div class="boost-panel" id="boostPanel">
    <h4>Volume Booster</h4>
    <input type="range" id="volumeSlider" min="0.5" max="2" step="0.1" value="1" style="width:100%;">
    <p id="volPercent" style="text-align:center;margin:10px 0;">100%</p>
</div>

<script src="movie_data.js"></script>
<script src="hollywood_servers.js"></script>
<script src="bollywood_servers.js"></script>
<script src="player.js"></script>
<script src="series_fixer.js"></script>
<script src="booster.js"></script>

<script>
    const API_KEY = "82e880c89dbf119b940e034ed32a3498";

    async function loadAllSections() {
        // GOAT Section
        const goatMovies = [
            {id:238, title:"The Godfather", year:"1972", poster_path:"/3bhkrj58Vtu7enYsRolD1fZdja1.jpg"},
            {id:240, title:"The Godfather Part II", year:"1974"},
            {id:278, title:"The Shawshank Redemption", year:"1994"},
            {id:155, title:"The Dark Knight", year:"2008"},
            {id:680, title:"Scarface", year:"1983"},
            {id:157336, title:"Interstellar", year:"2014"}
        ];
        displayHorizontal( goatMovies, 'goat-grid');

        // Trending + Others (use your existing loadSection logic)
        await loadHorizontalSection('trending', 'https://api.themoviedb.org/3/trending/movie/day', 'trending-grid');
        await loadHorizontalSection('hollywood', `https://api.themoviedb.org/3/discover/movie?with_original_language=en`, 'hollywood-grid');
        await loadHorizontalSection('bollywood', `https://api.themoviedb.org/3/discover/movie?with_original_language=hi`, 'bollywood-grid');
        await loadHorizontalSection('regional', `https://api.themoviedb.org/3/discover/movie?with_keywords=235476|179430`, 'regional-grid');
    }

    function displayHorizontal(items, containerId) {
        const container = document.getElementById(containerId);
        container.innerHTML = "";
        items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'movie-card';
            card.innerHTML = `<img class="movie-poster" src="https://image.tmdb.org/t/p/w400${item.poster_path || ''}"><div style="padding:8px;"><strong>${item.title}</strong></div>`;
            card.onclick = () => window.routeToDedicatedPlayer(item.id, item.title, 'movie', item.year);
            container.appendChild(card);
        });
    }

    // Volume Booster
    function toggleBoosterPanel() {
        const panel = document.getElementById('boostPanel');
        panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    }

    document.getElementById('volumeSlider').addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        document.getElementById('volPercent').innerText = Math.round(val * 100) + "%";
        if (typeof executeHardwareAmplification === 'function') {
            executeHardwareAmplification(val);
        }
    });

    document.addEventListener("DOMContentLoaded", loadAllSections);
</script>
</body>
</html>
