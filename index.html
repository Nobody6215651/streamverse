<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVerse OTT - Automated Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .loading-text { color: #aaa; padding: 20px; font-size: 18px; text-align: center; width: 100%; }
        .movie-card { cursor: pointer; }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo">Stream<span>Verse</span></div>
        <nav class="nav-links">
            <a href="#" class="nav-item active" onclick="loadTrending('movie', event)">Movies</a>
            <a href="#" class="nav-item" onclick="loadTrending('tv', event)">Web Series</a>
        </nav>
        <div class="search-container">
            <input type="text" id="search-bar" placeholder="Type ANY movie name..." onkeyup="searchTMDB()">
            <i class="fas fa-search search-icon"></i>
        </div>
    </header>

    <section class="hero-banner" id="hero-section">
        <div class="hero-content">
            <h1 id="hero-title">Streaming Hub</h1>
            <p>Dunya ki koi bhi movie upar search karein, original poster aur high quality nodes ke sath instantly hazir ho jayegi.</p>
        </div>
    </section>

    <main class="main-content">
        <h2 class="section-title" id="current-category-title">Trending Today (Auto-Updated)</h2>
        <div class="movie-grid" id="movie-grid-container">
            <div class="loading-text">Loading latest movies from global databases...</div>
        </div>
    </main>

    <div class="video-modal" id="videoPlayerModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closePlayer()">&times;</span>
            <h3 id="modal-video-title" style="color: #fff; margin-bottom: 15px;">Playing</h3>
            <div class="video-wrapper">
                </div>
            <div class="server-options" style="margin-top: 15px;">
                <span>Servers: </span>
                <button class="server-btn active" onclick="switchServer(1)">Server 1</button>
                <button class="server-btn" onclick="switchServer(2)">Server 2</button>
            </div>
        </div>
    </div>

    <script>
        // Aapki API key yahan permanent save kar di hai
        const API_KEY = "82e880c89dbf119b940e034ed32a3498"; 
        
        let currentServer1 = "";
        let currentServer2 = "";
        let searchTimeout = null;

        // Automatically load trending movies on startup
        document.addEventListener("DOMContentLoaded", () => {
            loadTrending('movie');
        });

        // Fetch Trending content from global databases
        async function loadTrending(type = 'movie', event = null) {
            if(event) {
                event.preventDefault();
                document.querySelectorAll('.nav-links a').forEach(link => link.classList.remove('active'));
                event.target.classList.add('active');
            }
            
            const container = document.getElementById('movie-grid-container');
            container.innerHTML = "<div class='loading-text'>Fetching trending records...</div>";
            document.getElementById('current-category-title').innerText = type === 'movie' ? "Trending Movies" : "Trending Web Series";

            try {
                let response = await fetch(`https://api.themoviedb.org/3/trending/${type}/day?api_key=${API_KEY}`);
                let data = await response.json();
                displayMovies(data.results, type);
            } catch (err) {
                container.innerHTML = "<p style='color:red; text-align:center; width:100%;'>Failed to load live data stream.</p>";
            }
        }

        // Global Universal Search functionality
        function searchTMDB() {
            clearTimeout(searchTimeout);
            let query = document.getElementById('search-bar').value.trim();
            const container = document.getElementById('movie-grid-container');

            if (!query) {
                loadTrending('movie');
                return;
            }

            searchTimeout = setTimeout(async () => {
                container.innerHTML = "<div class='loading-text'>Searching global servers...</div>";
                document.getElementById('current-category-title').innerText = `Search Results for "${query}"`;

                try {
                    let response = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(query)}`);
                    let data = await response.json();
                    
                    let validResults = data.results.filter(item => item.poster_path && (item.media_type === 'movie' || item.media_type === 'tv'));
                    displayMovies(validResults, 'mixed');
                } catch (err) {
                    container.innerHTML = "<p style='color:red; text-align:center; width:100%;'>Search node communication failure.</p>";
                }
            }, 500);
        }

        // Display results into the HTML Grid dynamic templates
        function displayMovies(movies, defaultType) {
            const container = document.getElementById('movie-grid-container');
            container.innerHTML = "";

            if(!movies || movies.length === 0) {
                container.innerHTML = "<div class='loading-text'>No matching titles found in world database.</div>";
                return;
            }

            movies.forEach(movie => {
                let title = movie.title || movie.name;
                let date = movie.release_date || movie.first_air_date || "N/A";
                let year = date.split("-")[0];
                let type = movie.media_type || defaultType;
                let posterUrl = `https://image.tmdb.org/t/p/w400${movie.poster_path}`;
                let quality = type === 'movie' ? '4K UHD' : 'HD Series';

                // TMDB types filter to standard player configuration
                let mediaType = type;
                if(type === 'mixed') {
                    mediaType = movie.title ? 'movie' : 'tv';
                }

                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => openPlayer(movie.id, title, mediaType);

                card.innerHTML = `
                    <span class="badge">${quality}</span>
                    <img class="movie-poster" src="${posterUrl}" onerror="this.src='https://images.unsplash.com/photo-1594909122845-11baa439b7bf?q=80&w=400'">
                    <div class="movie-info">
                        <strong>${title}</strong>
                        <div style="color: #888; font-size:11px; margin-top:5px;">Year: ${year} | ${mediaType.toUpperCase()}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 3. STREAMING PLAYER CONTROLLER
        function openPlayer(tmdbId, title, type) {
            document.getElementById('videoPlayerModal').style.display = 'flex';
            document.getElementById('modal-video-title').innerText = "Streaming: " + title;
            
            let videoWrapper = document.querySelector('.video-wrapper');
            
            if (type === "movie") {
                currentServer1 = `https://vidsrc.to/embed/movie/${tmdbId}`;
                currentServer2 = `https://multiembed.to/get.php?video_id=${tmdbId}&tmdb=1`;
            } else {
                currentServer1 = `https://vidsrc.to/embed/tv/${tmdbId}/1/1`;
                currentServer2 = `https://multiembed.to/get.php?video_id=${tmdbId}&tmdb=1&s=1&e=1`;
            }

            videoWrapper.innerHTML = `<iframe src="${currentServer1}" style="width: 100%; height: 400px; border: none;" allowfullscreen></iframe>`;
        }

        function closePlayer() {
            let videoWrapper = document.querySelector('.video-wrapper');
            videoWrapper.innerHTML = ""; 
            document.getElementById('videoPlayerModal').style.display = 'none';
        }

        function switchServer(serverNum) {
            let videoWrapper = document.querySelector('.video-wrapper');
            let buttons = document.querySelectorAll('.server-btn');
            
            buttons.forEach((btn, i) => {
                if (i === (serverNum - 1)) btn.classList.add('active');
                else btn.classList.remove('active');
            });

            if (serverNum === 1) {
                videoWrapper.innerHTML = `<iframe src="${currentServer1}" style="width: 100%; height: 400px; border: none;" allowfullscreen></iframe>`;
            } else {
                videoWrapper.innerHTML = `<iframe src="${currentServer2}" style="width: 100%; height: 400px; border: none;" allowfullscreen></iframe>`;
            }
        }
    </script>
</body>
</html>
