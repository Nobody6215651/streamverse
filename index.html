<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVerse Premium</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background:#0b0b0b; color:#fff; margin:0; font-family:sans-serif; }
        .navbar { display:flex; justify-content:space-between; align-items:center; padding:15px 5%; background:#000; position:sticky; top:0; z-index:1000; }
        .logo span { color:#e50914; }
        .nav-links a { color:#ddd; margin:0 15px; text-decoration:none; font-weight:500; }
        .nav-links a:hover { color:#e50914; }
        #search-bar { background:#1f1f1f; border:1px solid #444; padding:10px 15px; border-radius:30px; width:280px; color:white; }

        .section { padding:25px 5%; }
        .section-title { font-size:28px; margin:25px 0 15px; padding-left:15px; border-left:5px solid #e50914; display:flex; align-items:center; gap:12px; }

        .scroll-container { display:flex; overflow-x:auto; gap:18px; padding:10px 0; scrollbar-width:none; }
        .scroll-container::-webkit-scrollbar { display:none; }
        .movie-card { min-width:175px; background:#141414; border-radius:10px; overflow:hidden; cursor:pointer; transition:0.3s; }
        .movie-card:hover { transform:scale(1.08); }
        .movie-poster { width:100%; height:260px; object-fit:cover; }

        .boost-panel { position:fixed; bottom:110px; right:30px; background:#1f1f1f; padding:20px; border-radius:12px; width:260px; display:none; box-shadow:0 10px 30px rgba(0,0,0,0.9); z-index:99999; }
        .boost-btn { position:fixed; bottom:30px; right:30px; background:#00ffcc; color:#000; width:70px; height:70px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:32px; box-shadow:0 0 25px rgba(0,255,204,0.7); z-index:99999; cursor:pointer; }
    </style>
</head>
<body>

<div id="main-website-view">
    <header class="navbar">
        <div class="logo">Stream<span>Verse</span></div>
        <nav class="nav-links">
            <a href="#" onclick="loadCategory('trending', event)" class="active">Trending</a>
            <a href="#" onclick="loadCategory('hollywood', event)">Hollywood</a>
            <a href="#" onclick="loadCategory('bollywood', event)">Bollywood</a>
            <a href="#" onclick="loadCategory('punjabi', event)">Punjabi</a>
            <a href="#" onclick="loadCategory('south', event)">South</a>
            <a href="#" onclick="loadCategory('series', event)">Series</a>
        </nav>
        <input type="text" id="search-bar" placeholder="Search any movie..." onkeyup="if(event.key==='Enter') searchHandler()">
    </header>

    <!-- GOAT Section - Top -->
    <div class="section">
        <h2 class="section-title">👑 All Time GOAT Movies</h2>
        <div class="scroll-container" id="goat-grid"></div>
    </div>

    <!-- Trending -->
    <div class="section">
        <h2 class="section-title">🔥 Trending Now</h2>
        <div class="scroll-container" id="trending-grid"></div>
    </div>

    <!-- Hollywood -->
    <div class="section">
        <h2 class="section-title">🎬 Hollywood Blockbusters</h2>
        <div class="scroll-container" id="hollywood-grid"></div>
    </div>

    <!-- Bollywood -->
    <div class="section">
        <h2 class="section-title">🇮🇳 Bollywood Hits</h2>
        <div class="scroll-container" id="bollywood-grid"></div>
    </div>

    <!-- Regional -->
    <div class="section">
        <h2 class="section-title">🌍 South & Punjabi Cinema</h2>
        <div class="scroll-container" id="regional-grid"></div>
    </div>
</div>

<!-- Player Page (same as your previous working one) -->
<div id="player-page-view" class="player-page-container" style="display:none;">
    <!-- Your player code here -->
    <button onclick="exitPlayerPage()">← Back</button>
    <h1 id="player-media-title"></h1>
    <p id="player-media-meta"></p>
    <div id="video-frame-target" style="background:#000; min-height:520px;"></div>
</div>

<!-- Volume Booster -->
<div class="boost-btn" onclick="toggleBoosterPanel()">🔊</div>
<div class="boost-panel" id="boostPanel">
    <h4>🎧 Volume Booster (200%)</h4>
    <input type="range" id="volumeSlider" min="0.5" max="2" step="0.05" value="1" style="width:100%;">
    <p id="volText" style="text-align:center; margin:10px 0; font-weight:bold;">100%</p>
</div>

<script src="movie_data.js"></script>
<script src="hollywood_servers.js"></script>
<script src="bollywood_servers.js"></script>
<script src="player.js"></script>
<script src="series_fixer.js"></script>

<script>
    const API_KEY = "82e880c89dbf119b940e034ed32a3498";

    // GOAT Movies
    const goatMovies = [
        {id:238, title:"The Godfather", year:"1972", poster_path:"/3bhkrj58Vtu7enYsRolD1fZdja1.jpg"},
        {id:240, title:"The Godfather Part II", year:"1974"},
        {id:278, title:"The Shawshank Redemption", year:"1994"},
        {id:155, title:"The Dark Knight", year:"2008"},
        {id:680, title:"Scarface", year:"1983"},
        {id:157336, title:"Interstellar", year:"2014"},
        {id:13, title:"Forrest Gump", year:"1994"}
    ];

    function displayHorizontal(items, containerId) {
        const cont = document.getElementById(containerId);
        cont.innerHTML = "";
        items.forEach(m => {
            const card = document.createElement('div');
            card.className = 'movie-card';
            card.innerHTML = `<img class="movie-poster" src="https://image.tmdb.org/t/p/w400${m.poster_path || ''}"><div style="padding:10px 8px;"><strong>${m.title}</strong><br><small>${m.year}</small></div>`;
            card.onclick = () => window.routeToDedicatedPlayer(m.id, m.title, 'movie', m.year);
            cont.appendChild(card);
        });
    }

    async function loadSection(url, containerId) {
        try {
            let res = await fetch(url + `&api_key=${API_KEY}`);
            let data = await res.json();
            displayHorizontal(data.results.slice(0,12), containerId);
        } catch(e) {}
    }

    function loadAll() {
        displayHorizontal(goatMovies, 'goat-grid');
        loadSection('https://api.themoviedb.org/3/trending/movie/day', 'trending-grid');
        loadSection('https://api.themoviedb.org/3/discover/movie?with_original_language=en', 'hollywood-grid');
        loadSection('https://api.themoviedb.org/3/discover/movie?with_original_language=hi', 'bollywood-grid');
        loadSection('https://api.themoviedb.org/3/discover/movie?with_keywords=235476|179430', 'regional-grid');
    }

    // Booster
    function toggleBoosterPanel() {
        const p = document.getElementById('boostPanel');
        p.style.display = p.style.display === 'block' ? 'none' : 'block';
    }

    document.getElementById('volumeSlider').addEventListener('input', (e) => {
        let val = parseFloat(e.target.value);
        document.getElementById('volText').innerText = Math.round(val*100) + "%";
        if (typeof executeHardwareAmplification === 'function') executeHardwareAmplification(val);
    });

    document.addEventListener("DOMContentLoaded", loadAll);
</script>
</body>
</html>
