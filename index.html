<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVerse Premium - Watch Movies & Series</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        * { box-sizing: border-box; }
        body { 
            background: #0b0b0b; 
            color: #ffffff; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Roboto, Arial, sans-serif; 
        }
        .navbar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 18px 5%; 
            background: rgba(0,0,0,0.95); 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            border-bottom: 1px solid #222; 
        }
        .logo { font-size: 28px; font-weight: bold; letter-spacing: 1px; }
        .logo span { color: #e50914; }
        .nav-links a { 
            color: #e5e5e5; 
            text-decoration: none; 
            margin: 0 16px; 
            font-weight: 500; 
            transition: 0.3s; 
        }
        .nav-links a:hover, .nav-links a.active { color: #e50914; }
        #search-bar { 
            background: #1f1f1f; 
            border: 2px solid #333; 
            color: white; 
            padding: 10px 20px; 
            border-radius: 30px; 
            width: 320px; 
            outline: none; 
        }
        #search-bar:focus { border-color: #e50914; width: 380px; }

        .section { padding: 35px 5%; }
        .section-title { 
            font-size: 29px; 
            margin: 30px 0 18px; 
            padding-left: 18px; 
            border-left: 5px solid #e50914; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
        }
        .scroll-container { 
            display: flex; 
            overflow-x: auto; 
            gap: 22px; 
            padding: 12px 0; 
            scrollbar-width: none; 
        }
        .scroll-container::-webkit-scrollbar { display: none; }
        .movie-card { 
            min-width: 178px; 
            background: #141414; 
            border-radius: 12px; 
            overflow: hidden; 
            cursor: pointer; 
            transition: all 0.3s; 
        }
        .movie-card:hover { transform: scale(1.08); box-shadow: 0 15px 30px rgba(229,9,20,0.25); }
        .movie-poster { width: 100%; height: 265px; object-fit: cover; display: block; }
        .movie-info { padding: 12px 10px; font-size: 14px; }

        .player-page-container { display: none; padding: 40px 5%; background: #000; min-height: 100vh; }
        .boost-btn { 
            position: fixed; 
            bottom: 35px; 
            right: 35px; 
            background: linear-gradient(135deg, #00ffcc, #0099ff); 
            width: 72px; 
            height: 72px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 34px; 
            color: #000; 
            box-shadow: 0 0 30px rgba(0,255,204,0.6); 
            z-index: 99999; 
            cursor: pointer; 
        }
        .boost-panel { 
            position: fixed; 
            bottom: 130px; 
            right: 35px; 
            background: #1a1a1a; 
            padding: 22px; 
            border-radius: 14px; 
            width: 290px; 
            display: none; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.85); 
            z-index: 99999; 
        }
    </style>
</head>
<body>

<div id="main-website-view">
    <!-- Navbar -->
    <header class="navbar">
        <div class="logo">Stream<span>Verse</span></div>
        <nav class="nav-links">
            <a onclick="loadCategory('trending', event)" class="active">Trending</a>
            <a onclick="loadCategory('hollywood', event)">Hollywood</a>
            <a onclick="loadCategory('bollywood', event)">Bollywood</a>
            <a onclick="loadCategory('punjabi', event)">Punjabi</a>
            <a onclick="loadCategory('south', event)">South Indian</a>
            <a onclick="loadCategory('series', event)">Web Series</a>
        </nav>
        <input type="text" id="search-bar" placeholder="Search any movie or series..." onkeyup="if(event.key==='Enter') searchHandler()">
    </header>

    <!-- ALL TIME GOAT -->
    <div class="section">
        <h2 class="section-title">👑 All Time GOAT Movies</h2>
        <div class="scroll-container" id="goat-grid"></div>
    </div>

    <!-- TRENDING -->
    <div class="section">
        <h2 class="section-title">🔥 Trending Now</h2>
        <div class="scroll-container" id="trending-grid"></div>
    </div>

    <!-- HOLLYWOOD -->
    <div class="section">
        <h2 class="section-title">🎬 Hollywood Blockbusters</h2>
        <div class="scroll-container" id="hollywood-grid"></div>
    </div>

    <!-- BOLLYWOOD -->
    <div class="section">
        <h2 class="section-title">🇮🇳 Bollywood Superhits</h2>
        <div class="scroll-container" id="bollywood-grid"></div>
    </div>

    <!-- REGIONAL -->
    <div class="section">
        <h2 class="section-title">🌍 South & Punjabi Cinema</h2>
        <div class="scroll-container" id="regional-grid"></div>
    </div>
</div>

<!-- PLAYER PAGE -->
<div id="player-page-view" class="player-page-container">
    <button onclick="exitPlayerPage()" style="padding:10px 20px; background:#333; color:white; border:none; border-radius:6px; cursor:pointer;">← Back to Home</button>
    <h1 id="player-media-title" style="margin:20px 0 8px; font-size:34px;"></h1>
    <p id="player-media-meta" style="color:#aaa; margin-bottom:25px;"></p>
    <div id="video-frame-target" style="background:#000; border-radius:12px; min-height:560px;"></div>
</div>

<!-- VOLUME BOOSTER -->
<div class="boost-btn" onclick="toggleBoosterPanel()" title="Volume Booster">🔊</div>
<div class="boost-panel" id="boostPanel">
    <h4 style="margin:0 0 15px 0;">🎧 Volume Booster (200%)</h4>
    <input type="range" id="volumeSlider" min="0.5" max="2" step="0.05" value="1" style="width:100%; accent-color:#00ffcc;">
    <p id="volText" style="text-align:center; margin:15px 0; font-size:18px; font-weight:bold; color:#00ffcc;">100%</p>
    <small style="color:#888;">Drag to boost sound</small>
</div>

<script src="movie_data.js"></script>
<script src="hollywood_servers.js"></script>
<script src="bollywood_servers.js"></script>
<script src="player.js"></script>
<script src="series_fixer.js"></script>

<script>
    const API_KEY = "82e880c89dbf119b940e034ed32a3498";

    // GOAT Movies
    const goatMovies = [
        {id:238, title:"The Godfather", year:"1972", poster_path:"/3bhkrj58Vtu7enYsRolD1fZdja1.jpg"},
        {id:240, title:"The Godfather Part II", year:"1974", poster_path:"/hek3koDUewhZ8p6c9zZq7e8wV7W.jpg"},
        {id:278, title:"The Shawshank Redemption", year:"1994", poster_path:"/9cqNxx0GxF0bflZmeSMuL5tnGFr.jpg"},
        {id:155, title:"The Dark Knight", year:"2008", poster_path:"/qJ2tW6WMUDux911r6m7haRef0WH.jpg"},
        {id:680, title:"Scarface", year:"1983", poster_path:"/iQ5HGg3fK8p6v3n0dZ2dQ7p7Z1L.jpg"},
        {id:157336, title:"Interstellar", year:"2014", poster_path:"/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg"},
        {id:13, title:"Forrest Gump", year:"1994", poster_path:"/arw2e9x2w2t5z5p5z5p5z5p5z5p5.jpg"}
    ];

    function displayHorizontal(items, containerId) {
        const container = document.getElementById(containerId);
        container.innerHTML = "";
        items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'movie-card';
            const poster = item.poster_path ? `https://image.tmdb.org/t/p/w400${item.poster_path}` : 'https://via.placeholder.com/400x600/222/fff?text=No+Poster';
            card.innerHTML = `
                <img class="movie-poster" src="${poster}">
                <div class="movie-info">
                    <strong>${item.title}</strong><br>
                    <small>${item.year}</small>
                </div>
            `;
            card.onclick = () => window.routeToDedicatedPlayer(item.id, item.title, 'movie', item.year);
            container.appendChild(card);
        });
    }

    async function loadHorizontalSection(url, containerId) {
        try {
            let res = await fetch(url + `&api_key=${API_KEY}`);
            let data = await res.json();
            displayHorizontal(data.results.slice(0, 15), containerId);
        } catch(e) {
            console.log("Section load failed");
        }
    }

    function loadAllSections() {
        displayHorizontal(goatMovies, 'goat-grid');
        loadHorizontalSection('https://api.themoviedb.org/3/trending/movie/day', 'trending-grid');
        loadHorizontalSection('https://api.themoviedb.org/3/discover/movie?with_original_language=en&sort_by=popularity.desc', 'hollywood-grid');
        loadHorizontalSection('https://api.themoviedb.org/3/discover/movie?with_original_language=hi&sort_by=popularity.desc', 'bollywood-grid');
        loadHorizontalSection('https://api.themoviedb.org/3/discover/movie?with_keywords=235476|179430&sort_by=popularity.desc', 'regional-grid');
    }

    function searchHandler() {
        let query = document.getElementById('search-bar').value.trim();
        if (!query) return loadAllSections();
        fetch(`https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(query)}`)
            .then(r => r.json())
            .then(data => displayHorizontal(data.results.filter(i => i.poster_path), 'trending-grid'));
    }

    // Volume Booster
    function toggleBoosterPanel() {
        const panel = document.getElementById('boostPanel');
        panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    }

    document.getElementById('volumeSlider').addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        document.getElementById('volText').innerText = Math.round(val * 100) + "%";
        if (typeof executeHardwareAmplification === 'function') {
            executeHardwareAmplification(val);
        }
    });

    // Player functions (make sure they are global)
    window.routeToDedicatedPlayer = function(id, title, type, year) {
        activeTmdbId = id;
        currentType = type;
        document.getElementById('main-website-view').style.display = 'none';
        document.getElementById('player-page-view').style.display = 'block';
        document.getElementById('player-media-title').innerText = title;
        document.getElementById('player-media-meta').innerText = `${type.toUpperCase()} | ${year}`;
        loadIframeStream(1, 1);
    };

    window.exitPlayerPage = function() {
        document.getElementById('player-page-view').style.display = 'none';
        document.getElementById('main-website-view').style.display = 'block';
    };

    document.addEventListener("DOMContentLoaded", loadAllSections);
</script>
</body>
</html>
