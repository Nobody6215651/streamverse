<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVerse Premium</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .section { margin-bottom: 50px; }
        .section-title { font-size: 26px; margin: 30px 0 20px; padding-left: 12px; border-left: 4px solid #e50914; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
        .movie-card { background: #141414; border-radius: 8px; overflow: hidden; cursor: pointer; transition: 0.3s; }
        .movie-card:hover { transform: scale(1.05); box-shadow: 0 10px 20px rgba(229,9,20,0.3); }
        .movie-poster { width: 100%; height: 260px; object-fit: cover; }
        .boost-btn { position: fixed; bottom: 30px; right: 30px; background: linear-gradient(135deg, #00ffcc, #00a8ff); width: 65px; height: 65px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; color: #000; box-shadow: 0 4px 20px rgba(0,255,204,0.5); z-index: 9999; cursor: pointer; }
    </style>
</head>
<body>

<div id="main-website-view">
    <header class="navbar"> ... (same as before) </header>

    <main class="main-content">
        <!-- Trending -->
        <div class="section">
            <h2 class="section-title">🔥 Trending Now</h2>
            <div class="movie-grid" id="trending-grid"></div>
        </div>

        <!-- Hollywood -->
        <div class="section">
            <h2 class="section-title">🎬 Hollywood Blockbusters</h2>
            <div class="movie-grid" id="hollywood-grid"></div>
        </div>

        <!-- Bollywood -->
        <div class="section">
            <h2 class="section-title">🇮🇳 Bollywood Hits</h2>
            <div class="movie-grid" id="bollywood-grid"></div>
        </div>

        <!-- South & Punjabi -->
        <div class="section">
            <h2 class="section-title">🌍 South & Punjabi Cinema</h2>
            <div class="movie-grid" id="regional-grid"></div>
        </div>

        <!-- All Time Best -->
        <div class="section">
            <h2 class="section-title">🏆 All Time Best Movies</h2>
            <div class="movie-grid" id="best-grid"></div>
        </div>
    </main>
</div>

<!-- Player Page (same as before) -->
<div id="player-page-view" class="player-page-container"> ... (same) </div>

<div class="boost-btn" onclick="toggleBoosterPanel()" title="Volume Booster">
    <i class="fas fa-volume-up"></i>
</div>

<script src="movie_data.js"></script>
<script src="hollywood_servers.js"></script>
<script src="bollywood_servers.js"></script>
<script src="player.js"></script>
<script src="series_fixer.js"></script>
<script src="booster.js"></script>

<script>
    const API_KEY = "82e880c89dbf119b940e034ed32a3498";

    async function loadAllSections() {
        // Trending
        loadSection('trending', 'https://api.themoviedb.org/3/trending/movie/day', 'trending-grid');
        // Hollywood
        loadSection('hollywood', `https://api.themoviedb.org/3/discover/movie?with_original_language=en&sort_by=popularity.desc`, 'hollywood-grid');
        // Bollywood
        loadSection('bollywood', `https://api.themoviedb.org/3/discover/movie?with_original_language=hi&sort_by=popularity.desc`, 'bollywood-grid');
        // Regional (South + Punjabi)
        loadSection('regional', `https://api.themoviedb.org/3/discover/movie?with_keywords=235476|179430&sort_by=popularity.desc`, 'regional-grid');
        // All Time Best (Top Rated)
        loadSection('best', `https://api.themoviedb.org/3/movie/top_rated`, 'best-grid');
    }

    async function loadSection(name, url, containerId) {
        try {
            let res = await fetch(url + `&api_key=${API_KEY}`);
            let data = await res.json();
            displayMovies(data.results.slice(0, 8), containerId); // Top 8
        } catch(e) {
            console.log("Failed to load " + name);
        }
    }

    function displayMovies(items, containerId) {
        const container = document.getElementById(containerId);
        container.innerHTML = "";
        items.forEach(item => {
            let title = item.title || item.name;
            let year = (item.release_date || item.first_air_date || "").split("-")[0];
            let poster = item.poster_path ? `https://image.tmdb.org/t/p/w400${item.poster_path}` : '';

            const card = document.createElement('div');
            card.className = 'movie-card';
            card.innerHTML = `
                <img class="movie-poster" src="${poster}">
                <div style="padding:10px;">
                    <strong>${title}</strong><br>
                    <small>${year}</small>
                </div>
            `;
            card.onclick = () => window.routeToDedicatedPlayer(item.id, title, item.media_type || 'movie', year);
            container.appendChild(card);
        });
    }

    function searchHandler() {
        let query = document.getElementById('search-bar').value.trim();
        if(!query) return loadAllSections();

        // Real search
        fetch(`https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(query)}`)
            .then(r => r.json())
            .then(data => {
                const container = document.getElementById('trending-grid'); // Show in trending for simplicity
                container.innerHTML = "<h3>Search Results</h3>";
                displayMovies(data.results.filter(i => i.poster_path), 'trending-grid');
            });
    }

    // Load everything on start
    document.addEventListener("DOMContentLoaded", loadAllSections);
</script>
</body>
</html>
